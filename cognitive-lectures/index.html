<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Lab · Cognitive Psychology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f1;--card:#fff;--line:#e8e1d3;--gold:#c9a96e;--dgold:#a8854a;--pgold:#f6eedd;--navy:#34466b;--ink:#2b2f3a;--muted:#6b7280;--green:#2f7a52;--pgreen:#e2f1e6;--red:#b0473a;--pred:#f8e6e2;--blue:#e3ecf7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;color:var(--navy)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;color:var(--navy);line-height:1.1}
.brand small{display:block;font-size:1rem;color:var(--dgold);font-weight:600;margin-top:4px}
.lecs{display:flex;flex-direction:column;gap:6px}
.lec{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;text-align:left;color:var(--navy);font-weight:600;font-size:.92rem}
.lec.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lec[disabled]{opacity:.45;cursor:default}
.lec span{display:block;font-weight:400;font-size:.78rem;opacity:.8}
.modes{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.mode{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;color:var(--ink);font-size:.9rem}
.mode.on{border-color:var(--gold);background:var(--pgold);font-weight:600}
.prog{margin-top:auto;font-size:.82rem;color:var(--muted)}
.bar{height:8px;background:var(--pgold);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);width:0}
main{padding:26px 34px 60px;max-width:1180px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dgold);font-weight:700}
h1{font-size:2.3rem;margin:4px 0 4px}
.lede{color:var(--muted);max-width:760px}
.screen{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;margin-top:18px;align-items:start}
.slidebox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 6px 22px rgba(52,70,107,.06)}
.slidebox img{width:100%;display:block;border-radius:8px}
.slidebox .ref{font-size:.78rem;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.extra{margin-top:12px}
.spnav{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}.spnav .btn{padding:4px 12px}.spd{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:.8rem}.spd.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.panel h2{font-size:1.9rem;line-height:1.1;margin-bottom:6px}
.essence{background:var(--pgold);border-left:5px solid var(--gold);border-radius:10px;padding:12px 16px;font-size:1.02rem;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:.86rem;color:var(--navy);font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chipbody{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.95rem;margin-bottom:10px}
.chipbody.on{display:block}
.chipbody p+p{margin-top:8px}
.chipbody ul{padding-left:18px}.chipbody li{margin:4px 0}
.trap .no{color:var(--red);font-weight:600}.trap .yes{color:var(--green);font-weight:600}
.nav{display:flex;gap:10px;align-items:center;margin-top:18px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:#fff;color:var(--navy)}
.got{margin-left:auto;border:1px solid var(--gold);background:#fff;color:var(--dgold);border-radius:10px;padding:9px 14px;font-weight:600}
.got.on{background:var(--green);border-color:var(--green);color:#fff}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:.72rem;color:var(--muted)}
.dot.cur{border-color:var(--navy);color:var(--navy);font-weight:700}
.dot.done{background:var(--pgreen);border-color:var(--green);color:var(--green)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px}
table.t td{border-top:1px solid var(--line);padding:7px 9px;vertical-align:top}
.demo{background:#fff;border:1px dashed var(--gold);border-radius:14px;padding:14px;margin-top:12px}
.demo h4{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--navy)}
/* quiz */
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.q .stem{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;margin:6px 0;font-size:.95rem}
.opt.right{background:var(--pgreen);border-color:var(--green)}
.opt.wrong{background:var(--pred);border-color:var(--red)}
.why{display:none;margin-top:8px;font-size:.92rem;background:var(--pgold);border-radius:10px;padding:10px 12px}
.why.on{display:block}
.score{font-weight:700;color:var(--navy)}
/* flashcards */
.fc{perspective:1000px;width:100%;max-width:560px;height:240px;margin:14px 0}
.fcin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:1.1rem}
.front{background:#fff;font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--navy);font-weight:700}
.back{background:var(--pgold);transform:rotateY(180deg)}
.breath{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-top:14px}
.breath p{margin:8px 0}
.hook{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--navy);font-style:italic}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.screen{grid-template-columns:1fr}main{padding:18px 16px 50px}h1{font-size:1.9rem}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Lecture Lab<small>Cognitive Psychology · 5 lectures · 10 exam questions</small></div>
  <div class="lecs" id="lecs"></div>
  <div class="modes" id="modes"></div>
  <div class="prog"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div><div style="margin-top:8px">Pages refer to your Pass the Year reader.</div></div>
</aside>
<main id="main"></main>
</div>

<script>const LECS={};</script>
<script src="l1.js"></script>
<script src="l2.js"></script>
<script src="l3.js"></script>
<script src="l4.js"></script>
<script src="l5.js"></script>
<script src="engine.js"></script>
</body>
</html>
