<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sezen’s Psychology Study Hub · Year 2</title>
<meta name="description" content="Psychology Year 2 course notes, study guides, statistics exercises and exam preparation.">
<style>
:root{color-scheme:light;--cream:#faf6ee;--header:#eee7db;--border:#e4daca;--ink:#24211d;--muted:#716b62;--orange:#a3542b}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif;font-size:16px;line-height:1.6}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:var(--orange)}.hub{max-width:1040px;margin:48px auto;background:var(--cream);border:1px solid var(--border);border-radius:12px;overflow:hidden}.header{padding:22px 32px;background:var(--header);border-bottom:1px solid var(--border)}.brand{font-size:17px;margin:0}.courses{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.courses button{padding:9px 14px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink)}.courses button[aria-pressed="true"]{background:#fff;border-color:var(--border)}main{padding:32px}h1{font-size:28px;line-height:1.3;font-weight:600;margin:0 0 16px}h2{font-size:22px;font-weight:500;margin:0 0 16px}.hint{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile{padding:26px;background:#fff;border:1px solid var(--border);border-radius:13px}.tile h2{margin-bottom:20px}.open{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:11px 18px}.open:hover{background:#884221}.back{border:0;background:transparent;color:var(--orange);padding:0;margin:0 0 22px}.resources{list-style:none;padding:0;margin:0;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.resources li+li{border-top:1px solid var(--border)}.resources a{display:flex;justify-content:space-between;gap:16px;padding:18px 22px;text-decoration:none;overflow-wrap:anywhere}.resources a:hover{background:#f6efe5}.resources a span:last-child{flex-shrink:0}.footer{padding:16px 32px;border-top:1px solid var(--border);font-size:14px;color:var(--muted)}.footer a{text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #a3542b;outline-offset:4px}[hidden]{display:none!important}@media(max-width:640px){.hub{margin:16px;border-radius:10px}.header,main{padding:22px}.grid{grid-template-columns:1fr}.tile{padding:22px}h1{font-size:25px}.courses{gap:4px}.courses button{padding:9px 10px}.footer{padding:16px 22px}}@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s ease}}
</style>
</head>
<body>
<div class="hub">
<header class="header"><p class="brand">Sezen’s Psychology Study Hub · Year 2</p><nav class="courses" aria-label="Courses"><button type="button" data-course="cognitive" aria-pressed="true">Cognitive Psychology</button><button type="button" data-course="statistics" aria-pressed="false">Statistics 2</button><button type="button" data-course="spss" aria-pressed="false">SPSS 2</button></nav></header>
<main id="main"><section id="overview"><h1 id="course-title">Cognitive Psychology</h1><p class="hint">Choose a theme</p><div class="grid" id="tiles"></div></section><section id="detail" hidden><button type="button" class="back" id="back">← All themes</button><h1 id="detail-title"></h1><p class="hint" id="detail-course"></p><ul class="resources" id="resources"></ul></section><noscript>Please enable JavaScript to browse the course cards. All original links are also available in the repository README.</noscript></main>
<footer class="footer"><a href="https://sezsaracoglu-lab.github.io/NID_NL/" target="_blank" rel="noopener noreferrer">NID ↗</a></footer>
</div>
<script>
// Add or edit study links here. Keep each URL exactly as it appears in your repository.
const base='https://sezsaracoglu-lab.github.io/';
const data={
cognitive:{title:'Cognitive Psychology',hint:'Choose a theme',groups:[
{title:'Theme 1',links:[['Lecture 1 Slide Visuals','cognitive_psychology_lecture_1/'],['Easy high level teaching','theme1_visualteachig_v2/']]},
{title:'Theme 2',links:[['Objectives and checklist','cognitive_theme2_objectiveandchecklist/'],['Deep dives checklist','cognitive_theme2_deepdive_Problem2/'],['Article','cognitive_theme2_article/'],['Lecture 2 Slide Visuals','cognitive_psychology_lecture_2/'],['Concept Explainer','concept-explainer_visual/']]},
{title:'Theme 3',links:[['Objectives','cognitive_theme3_Objectives/'],['Deep dive','cognitive_theme3/']]},
{title:'Theme 4',links:[['Objective Checklist','cognitive_theme4_objectives'],['Objective Checklist 2','cognitive_theme4_objective/'],['Deep dive','cognitive_theme4_problem-statements/']]},
{title:'Theme 6',links:[['Objective Checklist and Tutorial in Depth','cognitive_theme-5/']]}
]},
statistics:{title:'Statistics 2',hint:'Choose a week or exam collection',groups:[
{title:'Weeks 1 & 2',links:[['Week 1 and Week 2 Lectures','STAT_2_WEEK1_2/'],['Week 1 Lecture 1','stat2_theme1/'],['Week 2 Lecture 2','stat2_lecture2/']]},
{title:'Week 3',links:[['Week 3 Lecture 3 Additional','stat_2_lecture_3/'],['Week 3 Lecture 3','stat2_lecture3/']]},
{title:'Week 4 · Regression',links:[['Week 4 Lecture 4','stat2_lecture4/'],['Week 4 Homework 4 Regression','stat2_homework4/'],['Week 4 Homework 4 and Extra','stat2_homework4_Extra/'],['Week 4 Practice questions','theme4_practisetest/']]},
{title:'Week 5 · Multiple Regression',links:[['Week 5 Lecture 5 Multiple Regression','stat2_lecture5/'],['Week 5 Homework 5','stat2_theme5_homework/'],['Multiple Regression','stat2_theme5_focusedteachig/'],['Week 5 Homework 5 and Extra','stat2_theme5_homework_Assigment/']]},
{title:'Week 6 · One Way ANOVA',links:[['Week 6 Lecture 6 One Way ANOVA','stat2_theme6_annova/'],['One Way ANOVA · 12 Steps','stat2_theme6_short-teaching/'],['Week 6 Homework 6','stat2_theme6_homework/']]},
{title:'Week 7 · Two Way ANOVA',links:[['Week 7 Lecture 7 Two Way ANOVA','stat2_theme7_lecture/'],['Week 7 Homework 7 and Extra','stat2_theme7_solved_homework/'],['Two Way ANOVA','stat2_theme7_focus-/']]},
{title:'Practice Exams',links:[['Theme 2 Practice exam','stat_2_theme2_practise-exam/'],['Theme 3 Practice exam','stat2_theme2_practise-exam/'],['Theme 4 Practice exam','stat2_regression_practise_Exam/']]},
{title:'Mock Exams',links:[['Stat 1 Topics · Mock 1','stat2_moc_1/']]}
]},
spss:{title:'SPSS 2',hint:'Choose a meeting',groups:[{title:'Meeting 2',links:[['SPSS Meeting 2','SPSS_year2_theme1/']]}]}
};
const overview=document.getElementById('overview'),detail=document.getElementById('detail'),tiles=document.getElementById('tiles');
let active='cognitive';
function showCourse(key,focus=false){active=key;document.querySelectorAll('[data-course]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.course===key)));document.getElementById('course-title').textContent=data[key].title;overview.querySelector('.hint').textContent=data[key].hint;tiles.replaceChildren();data[key].groups.forEach((group,index)=>{const tile=document.createElement('article');tile.className='tile';const title=document.createElement('h2');title.textContent=group.title;const button=document.createElement('button');button.type='button';button.className='open';button.textContent=key==='cognitive'?'Open theme →':key==='spss'?'Open meeting →':'Open collection →';button.setAttribute('aria-label','Open '+group.title);button.addEventListener('click',()=>showGroup(index));tile.append(title,button);tiles.append(tile)});detail.hidden=true;overview.hidden=false;if(focus)document.querySelector('[data-course="'+key+'"]').focus()}
function showGroup(index){const group=data[active].groups[index];document.getElementById('detail-title').textContent=group.title;document.getElementById('detail-course').textContent=data[active].title;document.getElementById('back').textContent=active==='cognitive'?'← All themes':active==='spss'?'← All meetings':'← All collections';const list=document.getElementById('resources');list.replaceChildren();group.links.forEach(([label,path])=>{const li=document.createElement('li'),a=document.createElement('a'),text=document.createElement('span'),arrow=document.createElement('span');a.href=base+path;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',label+' (opens in a new tab)');text.textContent=label;arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');a.append(text,arrow);li.append(a);list.append(li)});overview.hidden=true;detail.hidden=false;document.getElementById('back').focus()}
document.querySelectorAll('[data-course]').forEach(b=>b.addEventListener('click',()=>showCourse(b.dataset.course)));document.getElementById('back').addEventListener('click',()=>showCourse(active,true));showCourse(active);
</script>
</body>
</html>
