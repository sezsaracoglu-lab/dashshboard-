<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Sheets · Cognitive Psychology</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#1d2433;--muted:#5d6472;--line:#e4e0d6;--sage:#2f6b45;--sagep:#e3f0e6;--clay:#8a2e1e;--clayp:#f8e3dc;--navy:#2b3a5c;--navyp:#e7ebf3;--gold:#b8923a;--goldd:#7a5b16;--goldp:#fbf3df;--beige:#f6eedd;
--serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:rgba(247,245,240,.95);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;height:58px;gap:12px}
.mark{font-family:var(--serif);font-weight:600;font-size:1.15rem;text-decoration:none}
.menu{display:flex;gap:18px;font-size:.95rem}.menu a{text-decoration:none;color:var(--muted)}.menu a:hover{color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:600 .9rem var(--sans);cursor:pointer;color:var(--navy);white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.intro{color:var(--muted);font-size:.92rem;margin:4px 0 10px}
/* header */
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:22px 26px;display:flex;gap:20px;align-items:center;margin-top:10px}
.hero .ic{font-size:3rem;line-height:1;background:rgba(255,255,255,.1);border-radius:18px;width:78px;height:78px;display:grid;place-items:center;flex:0 0 auto}
.hero .ey{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#e9d7a8;font-weight:700}
.hero h1{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.15;margin:2px 0 6px}
.hero .q{font-style:italic;color:#f3ead3}
.big{background:var(--goldp);border-left:6px solid var(--gold);border-radius:14px;padding:12px 18px;margin:14px 0 6px;font-family:var(--serif);font-size:1.12rem;color:var(--navy)}
.big b{font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--goldd);display:block;margin-bottom:2px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--navy);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.hint{color:var(--muted);font-size:.86rem;margin-bottom:12px}
/* journey */
.journey{display:grid;gap:14px;position:relative}
.step{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column}
.node{width:64px;height:64px;border-radius:50%;background:var(--beige);border:3px solid var(--gold);display:grid;place-items:center;font-size:1.9rem;margin:0 auto 6px;position:relative;z-index:2}
.num{position:absolute;top:-6px;right:-6px;background:var(--navy);color:#fff;font:700 .78rem var(--sans);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.step h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--navy);text-align:center;line-height:1.25}
.step .body{font-size:.9rem;color:var(--muted);text-align:center;margin:4px 0 10px;min-height:2.6em}
.arrow{position:absolute;top:44px;right:-15px;z-index:3;color:var(--gold);font-size:1.3rem;font-weight:700}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.chip{border:0;text-align:left;border-radius:10px;padding:7px 9px;cursor:pointer;font:600 .84rem/1.3 var(--sans);display:flex;gap:7px;align-items:flex-start;transition:transform .12s}
.chip:hover{transform:translateY(-1px)}
.chip .tg{flex:0 0 auto;font-size:.66rem;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.75);margin-top:1px}
.S{background:var(--sagep);color:var(--sage)}.C{background:var(--clayp);color:var(--clay)}.M{background:var(--goldp);color:var(--goldd)}.X{background:var(--navyp);color:var(--navy)}
.chip .more{display:none;font-weight:400;color:var(--ink);font-size:.86rem;margin-top:5px}
.chip.open{flex-wrap:wrap}.chip.open .more{display:block;flex-basis:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;margin:2px 0 12px}.legend span{padding:3px 9px;border-radius:999px;font-weight:700}
/* graphs */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:zoom-in}
.fig img{width:100%;border-radius:10px;display:block;background:#fff}
.fig p{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.4}
/* bottom */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.path{list-style:none;position:relative;padding-left:4px}
.path li{position:relative;padding:0 0 12px 40px;font-size:.93rem}
.path li:before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font:700 .8rem var(--sans);display:grid;place-items:center}
.path li:after{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px dotted var(--gold)}
.path li:last-child:after{display:none}
.vs{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;border-top:4px solid var(--navy)}
.rv:nth-child(2){border-top-color:var(--gold)}.rv:nth-child(3){border-top-color:var(--sage)}
.rv b{font-family:var(--serif);color:var(--navy);display:block;font-size:1rem}.rv span{font-size:.9rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.cd{border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.cd .ci{font-size:1.8rem;line-height:1}.cd b{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.trap{background:var(--clayp)}.trap b{color:var(--clay)}.hook{background:var(--goldp)}.hook b{color:var(--goldd)}.hook span{font-family:var(--serif);font-style:italic;font-size:1.05rem}
.pn{display:flex;justify-content:space-between;margin:26px 0 40px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;font:600 .92rem var(--sans);cursor:pointer;color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.lb{position:fixed;inset:0;background:rgba(29,36,51,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:88vh;border-radius:12px;background:#fff}
@media (max-width:900px){.figs{grid-template-columns:1fr}.grid2,.cards{grid-template-columns:1fr}.hero{padding:18px}.hero h1{font-size:1.6rem}.hero .ic{width:60px;height:60px;font-size:2.2rem}}
@media (max-width:760px){.journey{grid-template-columns:1fr!important}.arrow{top:auto;bottom:-17px;right:50%;transform:translateX(50%) rotate(90deg)}.step .body{min-height:0}.menu{display:none}}
</style></head><body>

 [["Broadbent early filter", "Meaning blocked. For: Cherry. Against: own name, story, translation."], ["Treisman attenuation", "Ignored input turned down, not off. For: story, translation, only a third hear their name."], ["Deutsch & Deutsch late", "Everything understood, choice at the end. Against: only a third hear their name."]], "trap": "New unexpected object missed is inattentional blindness; a before-after difference missed is change blindness. Do not swap them.", "hook": "Broadbent Blocks, Treisman Turns down, Deutsch Decides late; looking is not seeing.", "icon": "🔦", "figures": [{"file": "rev_t1_1.png", "caption": "Where the ignored message stops in three filter models. After Sternberg, Sternberg & Mio (2012), Figures 4.9 and 4.10."}, {"file": "rev_t1_2.png", "caption": "How many people miss the unexpected, and how many are sure they would see it. Data as reported by Simons (reading A)."}, {"file": "rev_t1_3.png", "caption": "The four costs of task switching. Approximate, read from the Monsell (2003) graph in Lecture 1."}]}, {"theme": 2, "title": "Working memory", "stop": "The workbench", "question": "How do we hold information for seconds while thinking with it, and what parts does that system have?", "bigidea": "Working memory is a small workbench of separate parts (voice, sketchpad, buffer, a boss storing nothing): it uses LTM but is more than activated LTM.", "flow": [{"head": "Limited STM store", "body": "few chunks, fades in seconds without rehearsal", "ev": "Miller; Brown-Peterson; Rundus", "icon": "🔢"}, {"head": "Separate from LTM?", "body": "more than switched-on long-term memory", "ev": "Bergmann; Race; Logie", "icon": "🧠"}, {"head": "Working memory model", "body": "four parts that hold and work", "ev": "Baddeley & Hitch; Robbins", "icon": "🛠️"}, {"head": "Parts tested", "body": "loop, sketchpad, executive, buffer each dissociable", "ev": "PV; Klauer & Zhao; Miyake", "icon": "🧩"}, {"head": "Children's sums", "body": "only sketchpad adds unique variance", "ev": "McGonnell et al. (2024)", "icon": "➕"}], "story": ["1. Short-term memory (STM) is small: about seven chunks (units built from knowledge), fading within seconds without rehearsal (silent repeating), partly via interference.", "2. Atkinson-Shiffrin saw STM as one serial waiting room between sensory memory and LTM. The U-shaped list curve fits: recency from STM, primacy from rehearsal into LTM.", "3. The unitary view says STM is just activated LTM. Mostly no: new pairs need no hippocampus, and STM rearranges items.", "4. Baddeley and Hitch: working memory holds and works at once, with four limited parts. Dual-task logic: tasks clash only if they share a part; a crossover (double dissociation) proves separation.", "5. Each part has signature evidence, though hard tasks make the parts lean on the executive. In children, only the sketchpad uniquely predicts sums."], "studies": [{"name": "Miller (1956)", "v": "X", "line": "STM holds about seven plus or minus two chunks; Cowan (2005): about four without chunking.", "step": 1}, {"name": "Rundus (1971)", "v": "X", "line": "Free recall gives a U-curve: recency from STM, primacy from rehearsal; a pre-recall distractor removes only recency.", "step": 1}, {"name": "Wickens et al. (1976)", "v": "X", "line": "Brown-Peterson with one category, then fruits: jobs group recovered most (release from PI); interference depends on meaning.", "step": 1}, {"name": "Bergmann et al. (2012)", "v": "C", "line": "Against unitary view: holding new word pairs for seconds showed no hippocampus activity.", "step": 2}, {"name": "Robbins et al. (1996)", "v": "S", "line": "Chess moves suffered when sketchpad or executive was busy, not the inner voice ('see-saw').", "step": 3}, {"name": "Baddeley et al. (1975)", "v": "S", "line": "Short words beat long words; articulatory suppression removed this for read words: word-length effect reflects the inner voice.", "step": 4}, {"name": "Patient PV (Baddeley et al., 1988, 1998)", "v": "S", "line": "McGonnell et al. (2024). A: how the AWMA isolates the components. B: variance explained per regression step (Table 3)."}]}, {"theme": 3, "title": "Autobiographical memory and amnesia", "stop": "The life archive", "question": "How do we remember our own lives, and what do amnesia and memory mistakes reveal about how memory is built?", "bigidea": "Your life memory is rebuilt each time by the person you are now, so it can be lost, bent or even made up.", "flow": [{"head": "Shape of a life", "body": "Hole before 3, bump 10 to 30, recent rise", "ev": "Rubin 1986; Jack; Wang", "icon": "📈"}, {"head": "Self-memory system", "body": "Knowledge base plus working self; coherence beats accuracy", "ev": "Woike; Uzer", "icon": "🪞"}, {"head": "Amnesia", "body": "Lost time and place tag; implicit memory survives", "ev": "H.M.; Warrington; Huppert; Jon", "icon": "🕳️"}, {"head": "Memory is malleable", "body": "Photos and questions change what is stored", "ev": "Soares & Storm; Loftus 1978", "icon": "✏️"}], "story": ["1. Memories per age form the retention function: childhood amnesia (almost nothing before 3), the reminiscence bump (10 to 30), then normal forgetting.", "2. Childhood amnesia ends gradually (2 to 5) as language, self and parental 'memory talk' grow. The bump: firsts, identity, peak functioning, life script.", "3. Conway's self-memory system: a knowledge base (periods, general events, details) steered by the working self (who you are now). Coherence usually beats accuracy.", "4. Generative retrieval is a slow search via the working self; direct retrieval a fast pop-up from a cue. Depression brings overgeneral memories.", "5. Amnesia: anterograde (no new memories) and retrograde (past lost) vary independently. Explicit memory fails, implicit survives; the core loss is context binding (time and place tag).", "6. Photos hurt memory through attentional disengagement, not offloading. Misinformation bends memory: both versions are stored, their source confused."], "studies": [{"name": "Rubin et al. (1986)", "v": "X", "line": "Memories per age: hole before 3, peak at 10 to 30, recent rise; fading alone cannot explain it.", "step": 1}, {"name": "Jack et al. (2009)", "v": "S", "line": "Mothers who elaborated with toddlers had teenagers with earlier first memories: supports memory talk.", "step": 1}, {"name": "Wang (2006)", "v": "S", "line": "Americans had earlier, more self-focused first memories than Taiwanese: individualist culture, earlier memories.", "step": 1}, {"name": "Woike et al. (1999)", "v": "S", "line": "Agentic people recalled successes, communal people closeness: the working self steers memory.", "step": 2}, {"name": "Uzer et al. (2012)", "v": "S", "line": "Direct (pop-up) memories came about three times faster than searched-for ones: two retrieval routes.", "step": 2}, {"name": "H.M.", "v": "X", "line": "Hippocampus removed (1953): could learn nothing new, kept old knowledge; anterograde amnesia.", "step": 3}, {"name": "Warrington & Weiskrantz (1970)", "v": "S", "line": "Patients failed recall and recognition but matched controls on half-erased words: explicit and implicit memory separate.", "step": 3}, {"name": "Huppert & Piercy (1978)", "v": "S", "line": "Patients placed pictures seen twice on day 1 on day 2, mistaking familiar for recent: context binding.", "step": 3}, {"name": "Jon (Vargha-Khadem et al., 1997)", "v": "C", "line": "Small hippocampus from birth: poor recall, normal recognition and school learning; against Baddeley's modal model.", "step": 3}, {"name": "Dewar et al. (2010)", "v": "S", "line": "Patients recalled a story almost normally after a quiet hour, nearly nothing after a busy one: consolidation.", "step": 3}, {"name": "Soares & Storm (2018)", "v": "C", "line": "Even Snapchat or deleted photos hurt memory for painting details versus only looking: against offloading.", "step": 4}, {"name": "Loftus et al. (1978)", "v": "X", "line": "A question naming the wrong sign made many 'remember' it: misinformation creates details.", "step": 4}], "rivals": [["Offloading vs attentional disengagement", "Camera remembers for you, versus photographing pulls attention. Deleted photos still hurt: disengagement wins."]], "trap": "Anterograde means forward (no new memories), not before; overgeneral memory with depression is correlation, not proven cause.", "hook": "A hole, a hill and a slope; today's self holds the pen.", "icon": "📔", "figures": [{"file": "rev_t3_1.png", "caption": "The autobiographical retention function (illustrative shape, after Rubin, Wetzler & Nebes, 1986)."}, {"file": "rev_t3_2.png", "caption": "Soares & Storm (2018): proportion correct (approximate, read from Figure 1). Dashed bar = offloading prediction."}, {"file": "rev_t3_3.png", "caption": "Lecture 2: biases at each memory stage (data from the lecture slides)."}]}, {"theme": 4, "title": "Concepts and categories", "stop": "The filing system", "question": "How is our knowledge organised, so that we can recognise, name and predict new things?", "bigidea": "The mind stores what group members usually share, not definitions; widely shared features form the core, used first and lost last.", "flow": [{"head": "Definitions fail", "body": "No necessary and sufficient feature list; fuzzy edges", "ev": "Hampton (1979)", "icon": "📖"}, {"head": "Typicality and levels", "body": "Groups have a centre and a preferred basic level", "ev": "Rosch & Mervis; Rosch et al.", "icon": "🐦"}, {"head": "Prototype vs exemplar", "body": "One stored average, or all remembered examples?", "ev": "Posner; Allen & Brooks", "icon": "⚖️"}, {"head": "Linked network", "body": "Concepts are nodes; activation spreads along links", "ev": "Collins & Loftus (1975)", "icon": "🕸️"}, {"head": "Files fall apart", "body": "Semantic dementia loses distinctive features first", "ev": "Hodges; Bozeat et al. (2003)", "icon": "🍂"}], "story": ["1. The classical view: a concept is a definition of necessary features (every member has them) that together are sufficient (enough to belong). It fails: categories have fuzzy edges.", "2. Typicality: a robin is a better bird than a penguin. Family resemblance explains it: typical members share many features with their group, few with others.", "3. Levels: superordinate (animal), basic (dog), subordinate (terrier). The basic level wins as most differentiated: members alike, unlike other groups. Expertise shifts it.", "4. Prototype theory stores one weighted average; exemplar theory stores remembered examples; we probably use both. Concepts link in a semantic network; categories range from natural kinds to ad hoc goal groups.", "5. In semantic dementia (temporal lobes shrink) knowledge goes specific to general: distinctive features vanish first, shared ones survive and intrude."], "studies": [{"name": "Hampton (1979)", "v": "C", "line": "Membership judgements showed no clean line (sink barely a kitchen utensil): fuzzy edges, against classical view.", "step": 1}, {"name": "Rosch & Mervis (1975)", "v": "S", "line": "In invented categories, items with common features were learned first and rated more typical: family resemblance.", "step": 2}, {"name": "Rosch et al. (1976)", "v": "S", "line": "Naming pictures: 1,595 basic names, 14 subordinate, 1 superordinate. The basic level is the default.", "step": 2}, {"name": "Tanaka & Taylor (1991)", "v": "X", "line": "Birdwatchers say 'sparrow', not 'bird': expertise moves the basic level down to the specific level.", "step": 2}, {"name": "Collins & Loftus (1975)", "v": "X", "line": "Spreading activation: 'yellow' pre-activates 'lemon', so 'lemon' is recognised faster (semantic priming).", "step": 4}, {"name": "Allen & Brooks (1991)", "v": "S", "line": "Despite knowing a rule, people sorted new items with the similar old item. Supports exemplar theory.", "step": 3}, {"name": "Posner et al. (1967)", "v": "S", "line": "People 'recognised' a never-shown prototype dot pattern. Supports prototypes; exemplar theory cannot explain it.", "step": 3}, {"name": "Hodges, Graham & Patterson (1995)", "v": "S", "line": "Over 18 months a patient named a duck 'duck', 'swan', 'bird', 'animal': specific lost first, fitting a hierarchy.", "step": 5}, {"name": "Bozeat et al. (2003), Study 1", "v": "S", "line": "Patients drew about half the target features; drawing tracked naming, copying stayed good: lost meaning, not drawing skill.", "step": 5}, {"name": "Bozeat et al. (2003), Study 2", "v": "S", "line": "Errors rose from immediate copying to delayed copying to drawing from name, most when severe; geometric shapes normal.", "step": 5}, {"name": "Bozeat et al. (2003), distinctiveness", "v": "S", "line": "Distinctive features omitted, shared ones intruded; controlling sharing removed the animal versus object difference. Supports distributed features.", "step": 5}], "rivals": [["Prototype vs exemplar", "Average vs examples. Prototype: Posner. Exemplar: Allen & Brooks, context, correlated features."], ["Hierarchy vs distributed features", "Stored tree vs feature web; a feature model also yields duck to animal."]], "trap": "Necessary is not sufficient: all dogs breathe, but breathing does not make something a dog.", "hook": "Robin is the family face; the duck gets four legs.", "icon": "🗂️", "figures": [{"file": "rev_t4_1.png", "caption": "Category hierarchy and the basic level. Naming counts from Rosch et al. (1976), as reported by Murphy."}, {"file": "rev_t4_2.png", "caption": "Semantic network and priming by spreading activation. After Robinson-Riegler Figure 5.11; Collins & Loftus (1975)."}, {"file": "rev_t4_3.png", "caption": "Bozeat et al. (2003), Study 2: mean errors per item. Approximate, read from Figure 3."}]}, {"theme": 5, "title": "Mental imagery", "stop": "What the files look like", "question": "When you picture something, does the mind store a picture or only a description of its meaning?", "bigidea": "Mental images often work like pictures you can turn, scan and zoom, but sometimes only meaning is stored; the task decides.", "flow": [{"head": "Two codes or one?", "body": "Picture plus word code versus meaning only", "ev": "Paivio; Brooks", "icon": "🔤"}, {"head": "Images act like seeing", "body": "Time grows with angle, distance; small means blurry", "ev": "Shepard & Metzler; Kosslyn", "icon": "🔄"}, {"head": "Images carry a caption", "body": "Hidden shapes and second readings stay hidden", "ev": "Reed; Chambers & Reisberg", "icon": "🦆"}, {"head": "Weirdness runs on meaning", "body": "Busy imagery leaves the bizarreness gap intact", "ev": "Besken & Mulligan (2021)", "icon": "🤪"}, {"head": "Language tilts thought", "body": "Weak Sapir-Whorf: easier paths, not walls", "ev": "Winawer; Boroditsky; Heider", "icon": "🗣️"}], "story": ["1. Dual-code theory (Paivio): pictures use an analogue code (resembles the thing, like clock hands), words a symbolic code (arbitrary, like '9'). Propositional theory: only abstract meaning is stored.", "2. If images are analogue, they behave like seeing (functional equivalence). They do: rotation and scanning time rise linearly, small images show fewer details, imagining a tree blocks seeing (Segal & Fusella).", "3. The brain agrees: visual cortex is active in detailed imagery, and neglect patients drop the left half of an imagined scene, so imagery uses seeing's spatial screen.", "4. But an image is not a photo: hidden shapes stay hidden, and a distance label changes scanning time. Images come with a caption.", "5. Weird sentences are remembered better (bizarreness effect). Busy visual imagery lowered recall overall but never shrank the weird-minus-normal gap: the advantage runs on meaning.", "6. Lecture 4: does language shape thought? Strong Sapir-Whorf (no word, no thought) failed (Dani learned English colour terms); weak Sapir-Whorf holds: language makes some thinking easier."], "studies": [{"name": "Brooks (1968)", "v": "S", "line": "Picture task slowest when answering by pointing, word task when speaking: tasks clash only within one code.", "step": 1}, {"name": "Shepard & Metzler (1971)", "v": "S", "line": "Same or mirror 3-D shapes: time rose linearly with angle, depth like flat; images turn like objects.", "step": 2}, {"name": "Kosslyn, Ball & Reiser (1978); Jolicoeur & Kosslyn (1985)", "v": "S", "line": "Island map: longer mental trips took longer; naive assistants told to expect a U-shape still found the line.", "step": 2}, {"name": "Kosslyn (1975)", "v": "S", "line": "Rabbit beside an elephant: details checked slower than beside a fly; small images show fewer details.", "step": 2}, {"name": "Zwaan et al. (2002)", "v": "S", "line": "After 'eagle in the sky', a flying eagle was recognised faster than a sitting one; meaning alone predicts no difference.", "step": 2}, {"name": "Reed (1974); Chambers & Reisberg", "v": "C", "line": "Hidden parallelogram in a remembered star found 14%; duck-rabbit hard to flip mentally: challenges the pure picture view.", "step": 3}, {"name": "Besken & Mulligan (2021)", "v": "C", "line": "Four experiments with visual or spatial distractors: recall fell overall, bizarreness gap stayed; challenges the picture explanation.", "step": 4}, {"name": "Winawer et al. (2007)", "v": "S", "line": "Russians matched blues faster across goluboy/siniy; verbal, not spatial, load removed it: weak Sapir-Whorf.", "step": 5}, {"name": "Boroditsky et al. (2002)", "v": "S", "line": "English speakers grouped and remembered pictures by time of action, Indonesian speakers (no tense) by person: weak Sapir-Whorf.", "step": 5}], "rivals": [["Picture view (Paivio, Kosslyn)", "Images resemble things; for: rotation, scanning, size, neglect; against: hidden shapes, distance labels."], ["Description view (Pylyshyn, Anderson & Bower)", "Only meaning stored; for: Reed, bizarreness; against: time rising with angle and distance."]], "trap": "Lower recall of everything under distraction is not imagery evidence; only a shrinking weird-minus-normal gap is.", "hook": "Turns and trips take time, hidden shapes stay hidden, weird sticks by meaning.", "icon": "🖼️", "figures": [{"file": "rev_t5_1.png", "caption": "Which evidence supports the analogue side, the propositional side and dual coding (Readings A to C)."}, {"file": "rev_t5_2.png", "caption": "RT rises linearly with angle and distance; a description predicts no change. Illustrative, after Shepard & Metzler (1971) and Kosslyn et al. (1978)."}, {"file": "rev_t5_3.png", "caption": "Besken & Mulligan (2021), sentence access, Tables 2 to 5. Dashed line: illustrative imagery prediction. Exp 1 control = auditory control; * = no imagery instruction."}]}, {"theme": 6, "title": "Judgement and decision making", "stop": "Using what you know", "question": "When we guess chances and choose, do we calculate like a statistician, or take shortcuts that go wrong?", "bigidea": "We judge and choose with quick shortcuts that leave out information, so our mistakes follow a pattern that shows how the mind works.", "flow": [{"head": "Judging chances", "body": "shortcuts: looks typical, comes to mind, first number", "ev": "Taxicab, Linda, Ross & Sicoly", "icon": "🎲"}, {"head": "Biases follow", "body": "hindsight, overconfidence, confirmation: too sure of ourselves", "ev": "Carli, Fischhoff, Wason", "icon": "🔙"}, {"head": "Ideal chooser", "body": "expected utility: rules a logical person keeps", "ev": "Lichtenstein & Slovic", "icon": "🧮"}, {"head": "Real chooser", "body": "prospect theory: reference point, losses weigh more", "ev": "Asian disease, concert ticket", "icon": "🎟️"}, {"head": "Feelings and two systems", "body": "emotion shifts choices; fast System 1, slow System 2", "ev": "Porcelli & Delgado, De Neys", "icon": "🛩️"}], "story": ["1. Judgement means guessing how likely something is. We use heuristics (rules of thumb): representativeness (looks typical), availability (comes to mind easily), anchoring (start from a number, adjust too little).", "2. Representativeness causes base-rate neglect (ignoring how common something is), the conjunction fallacy and the gambler's fallacy.", "3. Expected utility theory is normative (how we should choose). Its rules: invariance (wording never matters), transitivity (no circles), cancellation (ignore shared parts). Utility flattens: diminishing marginal utility.", "4. Prospect theory is descriptive: gains and losses from a reference point, losses hurting more (loss aversion). Gain frames make us play safe, loss frames make us gamble; the certainty effect overweights sure things.", "5. Feelings (Lecture 3): emotion is short with a clear cause, mood long without one. Feelings vary in valence and arousal; strong motivational intensity narrows attention.", "6. Underneath (Lecture 5): fast System 1 and slow System 2. People sense conflict even when wrong, even when memory load blocks System 2 (Bago & De Neys, 2017): the hybrid model."], "studies": [{"name": "Kahneman & Tversky (1972), taxicab", "v": "X", "line": "85% Green taxis, witness says Blue (80% reliable). Correct is 41%; most say 80%: base-rate neglect.", "step": 1}, {"name": "Tversky & Kahneman (1983), Linda", "v": "X", "line": "Most rate 'bank teller and feminist' likelier than 'bank teller': conjunction fallacy, the description feels typical.", "step": 1}, {"name": "Gilovich et al. (1985); Miller & Sanjurjo (2018)", "v": "M", "line": "No hot hand at first; fixing a counting error revealed a small real one. Gambler's fallacy remains an error.", "step": 1}, {"name": "Ross & Sicoly (1979)", "v": "S", "line": "Each partner claims about 16 of 20 chores: own actions come to mind easier (availability).", "step": 1}, {"name": "Tversky & Kahneman (1974)", "v": "S", "line": "8x7x...x1 guessed 2,250, 1x2x...x8 guessed 512 (true 40,320): anchoring, too little adjustment.", "step": 1}, {"name": "Carli (1999)", "v": "X", "line": "Same story, different ending: each group 'knew it all along' and falsely remembered ending-fitting details: hindsight bias.", "step": 2}, {"name": "Lichtenstein & Slovic (1971, 1973)", "v": "C", "line": "People choose one bet but price the other higher (preference reversal), even in Las Vegas: challenges invariance.", "step": 3}, {"name": "Tversky & Kahneman (1981), Asian disease", "v": "S", "line": "Same options: 'saved' 72% take the sure option; 'die' 78% gamble. Supports prospect theory, breaks invariance.", "step": 4}, {"name": "Tversky & Kahneman (1981), concert ticket", "v": "S", "line": "Lost 20-euro note: 88% rebuy; lost ticket: 46%. Supports mental accounting.", "step": 4}, {"name": "Porcelli & Delgado (2009)", "v": "S", "line": "Ice-water stress made gain choices safer and loss choices riskier: stress strengthens framing (System 1).", "step": 5}, {"name": "De Neys & Glumicic (2008)", "v": "C", "line": "Even wrong answerers are slower and less sure on clash puzzles: they notice the conflict, against the serial model.", "step": 5}], "rivals": [["Expected utility vs prospect theory", "framing, preference reversals and sunk costs break expected utility's rules."], ["Kahneman & Tversky vs Gigerenzer", "shortcuts cause errors vs shortcuts fit the environment; counts and defaults favour Gigerenzer."]], "trap": "Same option, new wording breaks invariance, not transitivity (that needs a circle).", "hook": "Looks like, comes to mind, starts from; losses hurt more; autopilot and pilot.", "icon": "⚖️", "figures": [{"file": "rev_t6_1.png", "caption": "Prospect theory value function (illustrative shape, after Robinson-Riegler Figure 11.4)."}, {"file": "rev_t6_2.png", "caption": "Asian disease choices (Tversky & Kahneman, 1981); risky choices by frame and stress (Porcelli & Delgado, 2009)."}, {"file": "rev_t6_3.png", "caption": "Dual process models and the evidence (Lecture 5; values approximate, from the slides)."}]}, {"theme": 7, "title": "Problem solving and creativity", "stop": "Going beyond what you know", "question": "How do we get from a problem to a solution, and why do we get stuck on the obvious?", "bigidea": "Solving depends on how you see the problem: look at structure, not surface, and push away the obvious idea.", "flow": [{"head": "Represent and search", "body": "Picture the problem; pick an algorithm or heuristic", "ev": "Greeno; Newell & Simon", "icon": "🗺️"}, {"head": "Analogy", "body": "Reuse an old solution; noticing is the bottleneck", "ev": "Gick & Holyoak; Catrambone", "icon": "🔗"}, {"head": "Insight", "body": "Restructure an ill-structured problem: sudden or gradual?", "ev": "Metcalfe; Smith", "icon": "💡"}, {"head": "Fixation", "body": "Old habits and object uses block new solutions", "ev": "Luchins water jars", "icon": "🫙"}, {"head": "Creativity", "body": "Inhibit the obvious idea, then explore new ones", "ev": "Camarda et al. (2018)", "icon": "🥚"}], "story": ["An algorithm (fixed recipe) guarantees the answer but is slow; a heuristic (rule of thumb) is fast but can fail: skip LY, miss LYMPHOID.", "Means-ends analysis sets sub-goals and can step back; hill climbing always takes the most direct step, so it hits dead ends.", "Analogy reuses an old solution: notice, map, form a schema. Memory files problems by surface (looks), not structure (how parts relate), so noticing fails.", "Ill-structured problems need insight, a new way of seeing. Gestalt: sudden and special; others: gradual.", "Experience also traps us: mental set (a practised method) and functional fixedness (only an object's normal use) hide the simple route.", "Creativity: the dual-process view says inhibition (the mental brake) must push away System 1's obvious ideas; disinhibition says less control helps."], "studies": [{"name": "Greeno (1974)", "v": "S", "line": "River puzzle: people paused where sub-problems began and avoided the needed backward move. Supports means-ends analysis.", "step": 1}, {"name": "Gick & Holyoak (1980)", "v": "X", "line": "Radiation problem: 10% solved alone, 30% after the army story. Only about 20% noticed the analogy unaided.", "step": 2}, {"name": "Gick & Holyoak (1983)", "v": "S", "line": "Comparing two stories: 21% to 52%; a stated rule or diagram did not help. Supports schema induction.", "step": 2}, {"name": "Catrambone, Craig & Nersessian (2006)", "v": "S", "line": "Unhinted: blocks 52%, drawing 27%, memory 19%; with a hint nearly all solved. Noticing, not applying, is hard.", "step": 2}, {"name": "Lane & Schooler (2004)", "v": "X", "line": "Thinking aloud while choosing matches pulled people to surface matches: verbal overshadowing.", "step": 2}, {"name": "Markman, Taylor & Gentner (2007)", "v": "S", "line": "Hearing proverbs helped recall by meaning. No clash with Lane & Schooler: listening is not speaking.", "step": 2}, {"name": "Metcalfe & Wiebe (1987)", "v": "S", "line": "Warmth rose gradually for algebra, jumped suddenly for insight; success predicted only for algebra. Supports Gestalt.", "step": 3}, {"name": "Smith (1995a)", "v": "C", "line": "Insight can build gradually, and sleep helps. Challenges the 'insight is always sudden' Gestalt view.", "step": 3}, {"name": "Luchins (1942)", "v": "X", "line": "Water jars: 64 to 83% kept the practised long formula; only 1 to 5% of controls missed the easy route.", "step": 4}, {"name": "Camarda et al. (2018), Exp 1", "v": "S", "line": "Egg task: only incongruent Stroop (busy brake) cut ideas, about 7 vs 10.5. Supports dual-process, challenges disinhibition.", "step": 5}, {"name": "Camarda et al. (2018), Exp 2", "v": "S", "line": "A working-memory dot load did not cut ideas (about 11). The cost is specific to inhibition.", "step": 5}], "rivals": [["Disinhibition vs dual-process", "Less control or more inhibition? Camarda: a busy brake cut ideas, favouring dual-process."]], "trap": "People predict success on routine problems, NOT insight problems; a busy brake gives fewer ideas, not more.", "hook": "Notice, match, find the rule; to create, first say no to the obvious.", "icon": "🧩", "figures": [{"file": "rev_t7_1.png", "caption": "Noticing is the bottleneck. A: Gick & Holyoak (1983), Robinson-Riegler Figure 12.5. B: Catrambone, Craig & Nersessian (2006), Robinson-Riegler Table 12.4."}, {"file": "rev_t7_2.png", "caption": "Warmth before solving: gradual for algebra, flat then sudden for insight. Illustrative; the original (Metcalfe & Wiebe, 1987, Sternberg Figure 11.11) shows rating histograms at 60, 45, 30 and 15 s before solving."}, {"file": "rev_t7_3.png", "caption": "Mean fluidity on the egg task. Data from Camarda et al. (2018); the Experiment 2 low-load mean is not given in the text."}]}, {"theme": 8, "title": "Large language models in psychology", "stop": "The mirror", "question": "What can LLMs do for psychology, and what does using them do to our own thinking?", "bigidea": "An LLM returns the typical human answer: helpful when rushed or short of ideas, but used too early or too much, you copy, not think.", "flow": [{"head": "What an LLM is", "body": "Pre-trained to guess the next word in context", "ev": "Bag-of-words vs LLM", "icon": "🤖"}, {"head": "Plausible, not correct", "body": "Repeats what people usually say, true or false", "ev": "Study-advice example", "icon": "🎭"}, {"head": "Adapt and check", "body": "Fine-tune or prompt-tune; then face four concerns", "ev": "Belonging essays; Clapper", "icon": "🔧"}, {"head": "WHEN to use it", "body": "Best timing depends on time available", "ev": "Zhi, Kumar & Lee (2026)", "icon": "⏱️"}, {"head": "HOW MUCH to use it", "body": "Middle amount gives the most creativity", "ev": "Huang (2025) Studies 1-3", "icon": "🎚️"}], "story": ["1. Bag-of-words (LIWC) counts words, each with one fixed meaning. An LLM reads meaning in context, learned from billions of sentences, with millions of parameters (settings).", "2. Pre-training: guess the hidden word, send the error back (backpropagation), repeat. So an LLM produces typical language, not truth: plausible, not correct.", "3. For the expert version: fine-tune (expert-labelled examples, settings change, removes bias better) or prompt-tune (few examples in the prompt, settings unchanged, fast but shallow).", "4. Four concerns: evaluation (expert vs impact), bias (representational vs allocative harm; audit by changing only a name), black box (probe like an experiment), reproducibility (temperature).", "5. The mirror turns on us. Zhi: early LLM access helps when rushed; with enough time it anchors you: fewer own ideas, weaker recall, unnoticed in self-reports.", "6. Huang: creativity follows an inverted U. Moderate AI use beats low and high by widening knowledge diversity (variety of ideas), not problem restructuring."], "studies": [{"name": "Study-advice example (Demszky et al., 2023)", "v": "X", "line": "LLM advised a nervous pupil: timeline, reduce stress, self-care. Research finds such advice ineffective: sounds right, is not.", "step": 2}, {"name": "Belonging essays (Demszky and colleagues, Box 2)", "v": "S", "line": "Model fine-tuned on 650 expert-labelled essays scored about 11,000; more belonging themes predicted better college outcomes. Supports fine-tuning.", "step": 3}, {"name": "Clapper and colleagues (Box 3)", "v": "S", "line": "Prompt-tuned LLM growth-mindset speeches were rated by teenagers about as high as experts', closing 75% of the gap. Supports prompt-tuning.", "step": 3}, {"name": "Zhi, Kumar & Lee (2026): essay score", "v": "X", "line": "393 adults; LLM Early, Continuous, Late or none; 10 or 30 minutes. Rushed: Early best. With time: Late, No LLM best.", "step": 4}, {"name": "Zhi, Kumar & Lee (2026): myside bias", "v": "M", "line": "With 30 minutes all LLM groups were less one-sided, but Early and Continuous wrote fewer arguments. Only Late truly balanced.", "step": 4}, {"name": "Zhi, Kumar & Lee (2026): recall and self-report", "v": "X", "line": "Continuous access: worse recall, fewer documents checked; early users gained few own ideas. Self-ratings equal. Supports anchoring.", "step": 4}, {"name": "Huang (2025) Study 1", "v": "S", "line": "139 professionals used ChatGPT once, 4 to 6, or 9+ times. Moderate most creative; low and high equal.", "step": 5}, {"name": "Huang (2025) Studies 1 and 2: mediation", "v": "S", "line": "Variety of ideas showed the inverted U and explained creativity; outside-the-box thinking did not differ.", "step": 5}, {"name": "Huang (2025) Study 2", "v": "S", "line": "Preregistered replication, 319 US adults, new judges: same inverted U.", "step": 5}, {"name": "Huang (2025) Study 3", "v": "S", "line": "188 creative workers chose own AI use; bosses rated creativity: inverted U. Rules out demand effects; correlational.", "step": 5}], "rivals": [["More AI, better", "More AI, more creativity and thinking; for: early help when rushed; against: Huang's inverted U, Zhi with time."], ["Self-reports", "People know how AI affects their thinking; against: Zhi's self-ratings stayed equal while performance differed."]], "trap": "A low myside-bias score is not balance: Early and Continuous groups wrote fewer arguments. Check argument count first.", "hook": "The mirror shows the average: rushed, look early; with time, look last; never stare long.", "icon": "🪞", "figures": [{"file": "rev_t8_1.png", "caption": "Essay score per condition: the best condition flips with time available (temporal reversal, an interaction). Data from Zhi, Kumar & Lee (2026), Tables 3 and 4."}, {"file": "rev_t8_2.png", "caption": "Goldilocks pattern in creativity and its mechanism, knowledge diversity. Means from Huang (2025), Studies 1 and 2."}, {"file": "rev_t8_3.png", "caption": "Pre-training, fine-tuning and prompt-tuning, then evaluation. Based on Demszky et al. (2023), Figure 2 and Boxes 2 and 3."}]}];
const TAG = {S:"FOR",C:"AGAINST",M:"MIXED",X:"SHOWS"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabs = document.getElementById("tabs"), sheet = document.getElementById("sheet");
tabs.innerHTML = D.map((m,i)=>`<button class="tab" data-i="${i}">${m.icon} ${m.theme} · ${esc(m.title)}</button>`).join("");
function render(i){
  const m = D[i];
  [...tabs.children].forEach((b,j)=>b.classList.toggle("on", j===i));
  tabs.children[i].scrollIntoView({block:"nearest",inline:"center"});
  const n = m.flow.length;
  const steps = m.flow.map((f,k)=>{
    const st = m.studies.filter(s=>s.step===k+1);
    return `<div class="step"><div class="node">${f.icon}<span class="num">${k+1}</span></div>
      <h3>${esc(f.head)}</h3><div class="body">${esc(f.body)}</div>
      <div class="chips">${st.map(s=>`<button class="chip ${s.v}"><span class="tg">${TAG[s.v]}</span><span>${esc(s.name)}<span class="more">${esc(s.line)}</span></span></button>`).join("")}</div>
      ${k<n-1?'<span class="arrow">➜</span>':''}</div>`}).join("");
  sheet.innerHTML = `
  <section class="hero"><div class="ic">${m.icon}</div><div><div class="ey">Theme ${m.theme} · ${esc(m.stop)}</div><h1>${esc(m.title)}</h1><div class="q">${esc(m.question)}</div></div></section>
  <div class="big"><b>Big idea</b>${esc(m.bigidea)}</div>
  <h2 class="sec">🧭 The theme as a journey</h2>
  <p class="hint">Each step leads to the next. Under each step: the studies that test it. Tap a study to open what it showed.</p>
  <div class="legend"><span class="S">FOR = supports the idea</span><span class="C">AGAINST = challenges it</span><span class="M">MIXED</span><span class="X">SHOWS = demonstrates an effect</span></div>
  <div class="journey" style="grid-template-columns:repeat(${n},1fr)">${steps}</div>
  <h2 class="sec">📊 Graphs to recognise</h2>
  <p class="hint">Exam questions often show one of these. Tap to enlarge.</p>
  <div class="figs">${m.figures.map(f=>`<div class="fig" data-src="img/${f.file}"><img src="img/${f.file}" alt="${esc(f.caption)}" loading="lazy"><p>${esc(f.caption)}</p></div>`).join("")}</div>
  <div class="grid2">
    <div><h2 class="sec">🪜 The story in steps</h2><ol class="path">${m.story.map((s,k)=>`<li data-n="${k+1}">${esc(s.replace(/^\d+\.\s*/,""))}</li>`).join("")}</ol></div>
    <div>${m.rivals&&m.rivals.length?`<h2 class="sec">⚔️ Rival ideas</h2><div class="vs">${m.rivals.map(r=>`<div class="rv"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}</div>`:""}
      <div class="cards" style="grid-template-columns:1fr"><div class="cd trap"><span class="ci">⚠️</span><div><b>Watch out</b>${esc(m.trap)}</div></div>
      <div class="cd hook"><span class="ci">🪝</span><div><b>Memory hook</b><span>${esc(m.hook)}</span></div></div></div></div>
  </div>
  <div class="pn"><button class="btn" id="prev" ${i?"":"style='visibility:hidden'"}>← Theme ${i}</button><button class="btn primary" id="next" ${i<D.length-1?"":"disabled style='opacity:.4'"}>Theme ${i+2} →</button></div>`;
  sheet.querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
  sheet.querySelectorAll(".fig").forEach(f=>f.onclick=()=>{lb.querySelector("img").src=f.dataset.src;lb.classList.add("on")});
  const pv=document.getElementById("prev"), nx=document.getElementById("next");
  if(i) pv.onclick=()=>go(i-1); if(i<D.length-1) nx.onclick=()=>go(i+1);
}
const lb=document.getElementById("lb"); lb.onclick=()=>lb.classList.remove("on");
function go(i){ history.replaceState(null,"","#t"+(i+1)); render(i); window.scrollTo({top:0,behavior:"smooth"}); }
tabs.onclick=e=>{const b=e.target.closest(".tab"); if(b) go(+b.dataset.i)};
const h=/^#t(\d)$/.exec(location.hash); render(h? Math.min(7,Math.max(0,h[1]-1)) : 0);
</script><script src="https://sezsaracoglu-lab.github.io/dashshboard-/assets/sitenav.js" defer></script>
</body></html>
